---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        loadBalancerIP: {{ .Values.gateway.address | quote }}
        annotations:
          kube-vip.io/loadbalancerIPs: {{ .Values.gateway.address | quote }}
      envoyDeployment:
        container:
          # Preserve burst capacity for ingress traffic without reserving
          # resources that the data plane does not use continuously.
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
        # The shutdown-manager sidecar has no first-class resources field in
        # the EnvoyProxy API, so it is patched into the generated Deployment.
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        requests:
                          cpu: 10m
                          memory: 32Mi
                        limits:
                          cpu: 100m
                          memory: 128Mi
