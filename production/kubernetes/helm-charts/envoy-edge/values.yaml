    - s3.bonfirelit.dev
    - blog.bonfirelit.dev
    - hedgedoc.bonfirelit.dev
    - k8s.bonfirelit.dev
  authentikProxy:
    - dash.bonfirelit.dev
    - feed.bonfirelit.dev
    - dns.bonfirelit.dev
    - cl.bonfirelit.dev
    - b.bonfirelit.dev
    - cs.bonfirelit.dev
    - notify.bonfirelit.dev
    - notebook.bonfirelit.dev
    - sql.bonfirelit.dev
    - read.bonfirelit.dev
    - write.bonfirelit.dev
    - ci.bonfirelit.dev
