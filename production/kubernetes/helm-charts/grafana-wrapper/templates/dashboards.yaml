---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
data:
  cluster-overview.json: |
{{ .Files.Get "dashboards/cluster-overview.json" | nindent 4 }}
{{- range $path, $_ := .Files.Glob "dashboards/vendor/*.json" }}
{{- $filename := base $path }}
{{- $name := trimSuffix ".json" $filename }}
{{- $dashboard := $.Files.Get $path }}
{{- $dashboard = $dashboard | replace "\"uid\": \"$DS_PROMETHEUS\"" "\"uid\": \"victoriametrics\"" }}
{{- $dashboard = $dashboard | replace "\"uid\": \"${DS_PROMETHEUS}\"" "\"uid\": \"victoriametrics\"" }}
{{- $dashboard = $dashboard | replace "\"uid\": \"$datasource\"" "\"uid\": \"victoriametrics\"" }}
{{- $dashboard = $dashboard | replace "\"uid\": \"${datasource}\"" "\"uid\": \"victoriametrics\"" }}
{{- if eq $filename "envoy-overview.json" }}
{{- $dashboard = $dashboard | replace "envoy_cluster_upstream_rq_xx" "envoy_cluster_upstream_rq_xx_total" }}
{{- $dashboard = $dashboard | replace "envoy_http_downstream_rq_xx" "envoy_http_downstream_rq_xx_total" }}
{{- $dashboard = $dashboard | replace "envoy_listener_http_downstream_rq_xx" "envoy_listener_http_downstream_rq_xx_total" }}
{{- $dashboard = $dashboard | replace "envoy_cluster_upstream_cx_destroy" "envoy_cluster_upstream_cx_destroy_total" }}
{{- $dashboard = $dashboard | replace "envoy_http_downstream_cx_destroy" "envoy_http_downstream_cx_destroy_total" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" $.Chart.Name $.Chart.Version | quote }}
data:
  {{ $filename }}: |
{{ $dashboard | nindent 4 }}
{{- end }}
