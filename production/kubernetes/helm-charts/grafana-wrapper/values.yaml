---
grafana:
  testFramework:
    enabled: false

  rbac:
    create: false
  serviceAccount:
    create: true
    automountServiceAccountToken: false
  automountServiceAccountToken: false
  enableServiceLinks: false

  deploymentStrategy:
    type: Recreate

  persistence:
    enabled: true
    storageClassName: local-rebuildable
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  initChownData:
    enabled: false

  plugins:
    - victoriametrics-logs-datasource@0.30.1

  env:
    GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"

  datasources:
    datasources.yaml:
      apiVersion: 1
      deleteDatasources:
        - name: VictoriaMetrics
          orgId: 1
        - name: VictoriaLogs
          orgId: 1
      datasources:
        - name: VictoriaMetrics
          uid: victoriametrics
          type: prometheus
          access: proxy
          url: http://victoria-metrics.observability.svc.cluster.local:8428
          isDefault: true
          editable: false
          jsonData:
            httpMethod: POST
            timeInterval: 30s
        - name: VictoriaLogs
          uid: victorialogs
          type: victoriametrics-logs-datasource
          access: proxy
          url: http://victoria-logs.observability.svc.cluster.local:9428
          isDefault: false
          editable: false
          jsonData:
            httpMethod: POST
            maxLines: 50
            logLevelRules:
              - field: _msg
                value: "(?i)\\b(fatal|panic|error)\\b"
                level: error
                operator: regex
                enabled: true
              - field: _msg
                value: "(?i)\\bwarn(ing)?\\b"
                level: warning
                operator: regex
                enabled: true

  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: Kubernetes OOM ntfy
          receivers:
            - uid: kubernetes-oom-ntfy
              type: webhook
              disableResolveMessage: false
              settings:
                httpMethod: POST
                maxAlerts: 0
                url: "http://ntfy.ntfy.svc.cluster.local/prod-k8s-warnings\
                  ?tpl=yes&t=%7B%7B.title%7D%7D&m=%7B%7B.message%7D%7D\
                  &p=high&ta=warning,skull&md=yes"
    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: Kubernetes container events
          folder: Kubernetes
          interval: 1m
          rules:
            - uid: kubernetes-container-oom-killed
              title: KubernetesContainerOOMKilled
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: victoriametrics
                  model:
                    datasource:
                      type: prometheus
                      uid: victoriametrics
                    editorMode: code
                    expr: |-
                      max by (cluster, namespace, pod, container, uid) (
                        (
                          kube_pod_container_status_last_terminated_reason{
                            reason="OOMKilled"
                          } == 1
                        )
                        and on (namespace, pod, container, uid)
                        (
                          increase(
                            kube_pod_container_status_restarts_total[5m]
                          ) > 0
                        )
                      )
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: B
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params: []
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - B
                        reducer:
                          params: []
                          type: last
                        type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    reducer: last
                    refId: B
                    type: reduce
                - refId: C
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 0
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - C
                        reducer:
                          params: []
                          type: last
                        type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: B
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              dashboardUid: cluster-overview
              panelId: 4
              noDataState: OK
              execErrState: KeepLast
              for: 0s
              annotations:
                description: >-
                  The last container termination reason was OOMKilled and its
                  restart counter increased within the previous five minutes.
                summary: >-
                  A Kubernetes container was terminated by the OOM killer.
              labels:
                category: oom
                component: kubernetes
                severity: critical
              isPaused: false
              notification_settings:
                receiver: Kubernetes OOM ntfy
                group_by:
                  - namespace
                  - pod
                  - container
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 24h

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/default
            foldersFromFilesStructure: false
        - name: victoriametrics
          orgId: 1
          folder: Observability Stack
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/victoriametrics
            foldersFromFilesStructure: false
        - name: victorialogs
          orgId: 1
          folder: Observability Stack
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/victorialogs
            foldersFromFilesStructure: false
        - name: opentelemetry-collector
          orgId: 1
          folder: Observability Stack
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/opentelemetry-collector
            foldersFromFilesStructure: false
        - name: grafana-internal
          orgId: 1
          folder: Observability Stack
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/grafana-internal
            foldersFromFilesStructure: false
        - name: coredns
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/coredns
            foldersFromFilesStructure: false
        - name: flux-control-plane
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/flux-control-plane
            foldersFromFilesStructure: false
        - name: kyverno
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/kyverno
            foldersFromFilesStructure: false
        - name: authentik
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/authentik
            foldersFromFilesStructure: false
        - name: kubernetes-api-server
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/kubernetes-api-server
            foldersFromFilesStructure: false
        - name: envoy-overview
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/envoy-overview
            foldersFromFilesStructure: false
        - name: minio
          orgId: 1
          folder: Storage
          type: file
          disableDeletion: true
          allowUiUpdates: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/minio
            foldersFromFilesStructure: false
  dashboardsConfigMaps:
    default: grafana-dashboards
    victoriametrics: grafana-dashboard-victoriametrics-single-node
    victorialogs: grafana-dashboard-victorialogs-single-node
    opentelemetry-collector: grafana-dashboard-opentelemetry-collector
    grafana-internal: grafana-dashboard-grafana-internal
    coredns: grafana-dashboard-coredns
    flux-control-plane: grafana-dashboard-flux-control-plane
    kyverno: grafana-dashboard-kyverno
    authentik: grafana-dashboard-authentik
    kubernetes-api-server: grafana-dashboard-kubernetes-api-server
    envoy-overview: grafana-dashboard-envoy-overview
    minio: grafana-dashboard-minio

  grafana.ini:
    analytics:
      check_for_updates: false
      reporting_enabled: false
      feedback_links_enabled: false
    news:
      news_feed_enabled: false
    server:
      domain: dash.your.domain
      root_url: https://dash.your.domain
      enforce_domain: true
    security:
      cookie_secure: true
      cookie_samesite: lax
    users:
      allow_sign_up: false
      auto_assign_org: true
      auto_assign_org_role: Viewer
      viewers_can_edit: true
    auth:
      disable_login_form: true
    auth.basic:
      enabled: false
    auth.anonymous:
      enabled: false
    auth.proxy:
      enabled: true
      header_name: X-authentik-username
      header_property: username
      auto_sign_up: true
      sync_ttl: 5
      whitelist: 10.244.0.0/16
      headers: Name:X-authentik-name Email:X-authentik-email
      headers_encoded: false
      enable_login_token: false
    dashboards:
      default_home_dashboard_path: >-
        /var/lib/grafana/dashboards/default/cluster-overview.json

  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 3Gi
