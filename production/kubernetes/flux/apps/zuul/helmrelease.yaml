---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zuul
  namespace: flux-system
spec:
  install:
    createNamespace: true
  releaseName: zuul
  targetNamespace: zuul
  storageNamespace: zuul
  interval: 10m
  chart:
    spec:
      chart: ./production/kubernetes/helm-charts/zuul
      sourceRef:
        kind: GitRepository
        name: gerrit
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: zuul-secrets
      valuesKey: values.yaml
  values:
    nxs:
      # Zuul SQL migrations are forward-only. Keep every component on the
      # same immutable image set and verify DB compatibility before rollback.
      # yamllint disable rule:line-length
      statefulSets:
        zuul-scheduler:
          containers:
            scheduler:
              # renovate: datasource=docker
              # renovate: depName=quay.io/zuul-ci/zuul-scheduler
              imageTag: 14.3.0
        zuul-executor:
          containers:
            executor:
              # renovate: datasource=docker
              # renovate: depName=quay.io/zuul-ci/zuul-executor
              imageTag: 14.3.0
      deployments:
        zuul-fingergw:
          containers:
            fingergw:
              # renovate: datasource=docker
              # renovate: depName=quay.io/zuul-ci/zuul-fingergw
              imageTag: 14.3.0
        zuul-launcher:
          containers:
            launcher:
              # renovate: datasource=docker
              # renovate: depName=quay.io/zuul-ci/zuul-launcher
              imageTag: 14.3.0
        zuul-web:
          containers:
            web:
              # renovate: datasource=docker
              # renovate: depName=quay.io/zuul-ci/zuul-web
              imageTag: 14.3.0
      # yamllint enable rule:line-length
  dependsOn:
    - name: gerrit
    - name: local-path-provisioner
    - name: minio
    - name: postgresql
    - name: zookeeper
