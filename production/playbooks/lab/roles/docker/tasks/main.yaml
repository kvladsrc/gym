---
- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ lab_docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started

- name: Grant the administrator access to Docker
  ansible.builtin.user:
    name: "{{ lab_admin_user }}"
    groups:
      - docker
    append: true
