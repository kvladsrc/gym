[project]
name = "yaqs"
version = "0.1.0"
description = "Local game development library with page-cited semantic search for people and agents."
readme = "README.md"
requires-python = "==3.11.*"
keywords = ["rag", "semantic-search", "sqlite", "mcp", "embeddings", "game-development"]
dependencies = [
  "sqlite-vec>=0.1.6,<0.2",
  "mcp==2.2.0",
  # Also installed by mcp; the browser UI imports them directly.
  "starlette>=1.10,<2",
  "uvicorn>=0.54,<1",
  "torch==2.8.0",
  "transformers==4.52.1",
  "huggingface-hub==0.36.0",
  "tokenizers==0.21.4",
  "numpy==2.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11"]

[project.scripts]
yaqs = "yaqs.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
