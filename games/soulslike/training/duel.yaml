# Two duellists of one body and one network (Fighter, FighterAgent): the
# network fights its own past selves (ML-Agents symmetric self-play: one
# behaviour, teams 0 and 1). The arena player (unity/soulslike/Builds/Arena)
# runs without graphics at a fixed 1/60 s a frame, as fast as the CPU goes.
# Run by train.sh.
behaviors:
  Fighter:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      # Randomness, falling to nothing by max_steps. At 0.015 the bonus, summed
      # over the branches and largest for the 60-way action, paid for striking
      # as variedly, so as often, as could be: they swung in place (when a
      # blow's energy cost a third of today's, FighterAgent.EnergyWeight).
      beta: 1.0e-2
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      # 920 numbers come in (512 from the grid's convolutions, 408 others:
      # one-hots of actions, both bodies' six points): the first layer
      # narrower than that, a third for combinations of combinations. The
      # GPU is idle beside the trainer's Python, so the size costs nothing
      # in time.
      hidden_units: 512
      num_layers: 3
      # The 32 x 32 grid (0.25 m cells) through convolutions: the same weights
      # all over it, so a trunk a metre to the left reads the same wherever it
      # is, and a new layout (a level) is not new to it. "resnet": three
      # stages of 3 x 3 convolutions and residual blocks, each halving it, to
      # 3 x 3. "simple" (made for 84 x 84 images) crushed it to 2 x 2 at once;
      # "match3" keeps it whole at 144 channels (29 M weights), out of the
      # GPU's 8 GB; "fully_connected" learns every cell apart.
      vis_encode_type: resnet
      # A memory (LSTM): what the other did, its habits within a fight, what
      # the grid saw before it turned away. The network carries 256 numbers
      # from one decision to the next (128 of them, the LSTM's output, all the
      # action heads read: at 128 they read 64 for some 60 actions) and learns
      # what to keep; it learns on stretches of 32 decisions (6.4 s), so
      # longer links are learned less.
      memory:
        memory_size: 256
        sequence_length: 32
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 50000000
    # Not threaded: the update in a thread of its own did not help (Python's
    # GIL keeps the trainer on one core anyway) and the steps came slower.
    threaded: false
    time_horizon: 256
    summary_freq: 20000
    # A checkpoint (and its .onnx, for watch.sh and play.sh) every 100 k steps,
    # ~6 min: a save takes a second or two. 40 kept (~1.4 GB): the last 4 M
    # steps.
    keep_checkpoints: 40
    checkpoint_interval: 100000
    self_play:
      save_steps: 50000
      team_change: 250000
      swap_steps: 10000
      # 20 snapshots of 50 k steps: the old styles (and their answers) a
      # million steps back are still met. The snapshots live in memory only:
      # each --resume begins the window anew, full again in about an hour.
      window: 20
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

engine_settings:
  time_scale: 1
  capture_frame_rate: 60
  target_frame_rate: -1
  no_graphics: true

# The networks on the GPU: on the CPU the trainer held one core at 100 % and
# held the arenas back.
torch_settings:
  device: cuda

# The curriculum (FighterAgent.Stage): first turning to face the other, then
# the fight itself (adrenaline and energy draw them close; a stage for closing
# in is not needed). The stage passes by training progress (of max_steps
# above): face to 300 k steps.
environment_parameters:
  stage:
    curriculum:
      - name: Face
        completion_criteria:
          measure: progress
          behavior: Fighter
          threshold: 0.006
        value: 0.0
      - name: Fight
        value: 2.0
