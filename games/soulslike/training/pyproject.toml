[project]
name = "soulslike-training"
version = "0.1.0"
description = "RL for the soulslike's bosses: ML-Agents self-play in the Unity arena"
# mlagents 1.1.0 allows only Python 3.10.1-3.10.12.
requires-python = "==3.10.12"
dependencies = [
  "mlagents==1.1.0",
  # From 2.9 on, torch.onnx.export uses the dynamo exporter by default: it
  # needs onnxscript and cannot write the old opset ML-Agents asks for.
  "torch>=2.1.1,<2.9",
  "tensorboard",
  # record.py: the exported models, run outside Unity.
  "onnxruntime>=1.16,<1.20",
  # mlagents imports pkg_resources, gone from setuptools 81 on.
  "setuptools<81",
]

[tool.uv]
package = false
