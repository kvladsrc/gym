[project]
name = "assets-studio-flow"
version = "0.1.0"
description = "Saved job graphs and a separate editor for the asset studio."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx2>=2.13", "jsonschema>=4.25"]

[project.scripts]
studio-flow = "studio_flow.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_flow"]
