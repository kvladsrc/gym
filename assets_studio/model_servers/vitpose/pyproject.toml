[project]
name = "vitpose-model-server"
version = "0.1.0"
description = "2D joints of a character in a video (ViTPose++), as the studio's pose observations."
requires-python = "==3.11.*"
dependencies = [
  "model-server-sdk",
  "torch==2.8.0",
  "transformers>=4.57,<5",
  "safetensors>=0.6",
  "huggingface-hub>=0.35,<1",
  "numpy==1.26.4",
  "opencv-python-headless>=4.10,<4.12",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
vitpose-model-server = "vitpose_model_server.__main__:main"

[tool.uv.sources]
model-server-sdk = { path = "../../model_server_sdk", editable = true }
torch = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
