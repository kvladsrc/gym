[project]
name = "flux3-model-server"
version = "0.1.0"
description = "Image model server for the asset studio (FLUX 3 Image Klein: text-to-image and editing; GGUF Q8, its prompt upsampler in llama.cpp, blocks offloaded to disk on 8 GB)."
requires-python = "==3.11.*"
dependencies = [
  "model-server-sdk[images]",
  # The pinned llama.cpp build that runs the prompt upsampler (llm/runtime.py).
  "llm-model-server",
  "diffusers==0.43.0",
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers==5.24.0",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "gguf==0.19.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
flux3-model-server = "flux3_model_server.__main__:main"

[tool.uv.sources]
model-server-sdk = { path = "../../model_server_sdk", editable = true }
llm-model-server = { path = "../llm", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
