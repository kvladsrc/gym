[project]
name = "hairdeck-model-server"
version = "0.1.0"
description = "Hair-card model server for the asset studio, based on HairDeck (stylized hair cards from one character image)."
# Upstream's tested stack (requirements.txt at the pinned source revision):
# Python 3.12, torch 2.8, the inference and preprocessing packages. Previews,
# VRM export and the test-set evaluation (pyrender, Blender) are left out.
requires-python = "==3.12.*"
dependencies = [
  "model-server-sdk[images]",
  # The CUDA 12.9 build of upstream's torch 2.8.0, shared with unlimited_ocr.
  "torch==2.8.0",
  "torchvision==0.23.0",
  "numpy==2.5.4",
  "scipy==1.16.3",
  "scikit-image==0.25.2",
  "trimesh==5.1.1",
  "pillow==12.0.0",
  "opencv-python-headless==5.0.0.93",
  "safetensors==0.8.0",
  "huggingface-hub>=1.16",
  "certifi",
  # SAM 3 (a pinned source checkout) and its imports; it needs pkg_resources.
  "setuptools==80.9.0",
  "timm==1.0.22",
  "iopath==0.1.10",
  "ftfy==6.1.1",
  "regex==2025.11.3",
  "pycocotools==2.0.10",
  "einops==0.8.1",
  "psutil==7.1.3",
  "tqdm==4.67.1",
  # BiRefNet-matting's model code
  "transformers==5.20.2",
  "kornia==0.8.3",
  # DINOv3 through torch.hub (its hubconf imports these)
  "torchmetrics==1.9.0",
  "omegaconf==2.4.0",
  "submitit==1.5.4",
  "termcolor==3.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
hairdeck-model-server = "hairdeck_model_server.__main__:main"

[tool.uv.sources]
model-server-sdk = { path = "../../model_server_sdk", editable = true }
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
