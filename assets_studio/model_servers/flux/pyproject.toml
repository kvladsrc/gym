[project]
name = "flux-model-server"
version = "0.1.0"
description = "Text-to-image model server for the asset studio (FLUX.1-schnell, GGUF Q8, blocks offloaded to disk on 8 GB)."
# Same PyTorch 2.5.1 / CUDA 12.4 build as the TripoSR server: known to work here.
requires-python = "==3.11.*"
dependencies = [
  "model-server-sdk[images]",
  "torch==2.5.1",
  "diffusers==0.40.0",
  "transformers==5.17.0",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "gguf==0.19.0",
  "sentencepiece>=0.2",
  "protobuf>=5",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
flux-model-server = "flux_model_server.__main__:main"

[tool.uv.sources]
model-server-sdk = { path = "../../model_server_sdk", editable = true }
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
