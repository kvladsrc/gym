[project]
name = "gvhmr-worker"
version = "0.1.0"
description = "GVHMR's own environment for the gvhmr model server's child process."
# Upstream pins Python 3.10, PyTorch 2.3 / CUDA 12.1: the only prebuilt
# pytorch3d it uses is for that set (none for Python 3.11, which the SDK needs;
# hence a server and a worker environment).
requires-python = "==3.10.*"
dependencies = [
  # upstream's requirements.txt without notebooks, linters, DPVO, training and
  # cython_bbox (nothing imports it; ultralytics' tracker uses lapx)
  "torch==2.3.0",
  "torchvision==0.18.0",
  "timm==0.9.12",
  "lightning==2.3.0",
  "hydra-core==1.3",
  "hydra-zen",
  "hydra_colorlog",
  "rich",
  "numpy==1.23.5",
  "matplotlib",
  "setuptools>=68.0",
  "tensorboardX",
  "opencv-python",
  "ffmpeg-python",
  "scikit-image",
  "termcolor",
  "einops",
  "imageio==2.34.1",
  "av==13.0.0",
  "joblib",
  "pytorch3d",
  "trimesh",
  "smplx",
  "wis3d",
  "pycolmap",
  "ultralytics==8.2.42",
  "lapx",
  "gdown",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
pytorch3d = { url = "https://dl.fbaipublicfiles.com/pytorch3d/packaging/wheels/py310_cu121_pyt230/pytorch3d-0.7.6-cp310-cp310-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
