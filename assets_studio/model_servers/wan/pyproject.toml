[project]
name = "wan-model-server"
version = "0.1.0"
description = "Image-to-video model server for the asset studio (Wan2.2 TI2V-5B, GGUF Q8 transformer on the GPU)."
# The PyTorch 2.5.1 / CUDA 12.4 build known to work on this machine.
requires-python = "==3.11.*"
dependencies = [
  "model-server-sdk[images,video]",
  "torch==2.5.1",
  "diffusers==0.40.0",
  "transformers==5.17.0",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "gguf==0.19.0",
  "sentencepiece>=0.2",
  "protobuf>=5",
  "ftfy>=6.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
wan-model-server = "wan_model_server.__main__:main"

[tool.uv.sources]
model-server-sdk = { path = "../../model_server_sdk", editable = true }
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
