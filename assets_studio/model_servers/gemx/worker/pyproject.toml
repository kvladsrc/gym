[project]
name = "gemx-worker"
version = "0.1.0"
description = "GEM-X's own environment for the gemx model server's child process."
# Upstream needs PyTorch >= 2.10 (setup.cfg); GEM's own code runs from the pinned source
# checkout on PYTHONPATH (like the gvhmr worker), so these are its install_requires plus the
# video extra.
requires-python = "==3.11.*"
dependencies = [
  "torch==2.10.*",
  "transformers==5.3.0",
  "py-soma-x==0.3.3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "einops>=0.8,<1",
  "pillow>=10,<13",
  "opencv-python-headless>=4.10,<5",
  "omegaconf>=2.3,<2.4",
  "onnxruntime>=1.20,<2",
  "huggingface_hub",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
