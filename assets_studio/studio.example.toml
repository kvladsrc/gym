# Copy to ~/.config/assets-studio/studio.toml, then start model servers from model_servers/:
#   just xtts          (speech, port 9103)
#   just stable_audio  (sounds and music, port 9105; needs HF_TOKEN)
#   just gemma         (text, Gemma 4 12B, port 9106)
#   just qwen          (text, Qwen3.8 27B, port 9107)
#   just wan           (video from a first frame, Wan2.2, port 9108)
#   just qwen_image    (images with transparency, editing; Qwen-Image 2.1, port 9109)
#   just yue2          (songs with vocals from lyrics; YuE2, port 9110)
#   just hunyuan3d21   (3D shape; Hunyuan3D-2.1, offloaded, port 9119)
#   just mia           (Mixamo skeleton for a character; Make-It-Animatable, port 9113)
#   just hi3d          (3D refine: coarse mesh + image to fine geometry; Hi3D v1.0, port 9130)
#   just hunyuan_paint21 (PBR paint from its image; Hunyuan3D-Paint 2.1, port 9120)
#   just skintokens    (skeleton of any shape; SkinTokens, port 9116)
#   just unirig        (skeleton of any shape; UniRig, port 9117)
#   just kimodo        (humanoid animation from text; Kimodo, port 9118)
#   just kimodo_smplx  (native SMPL-X motion and in-betweens; Kimodo SMPL-X, port 9128)
#   just birefnet      (background removal; BiRefNet, port 9121)
#   just mocapanything (animation of a rig from a video; MoCapAnything V2, port 9122)
#   just gvhmr        (human motion from video onto a Mixamo rig, port 9123)
#   just htd_refine   (native SMPL-X refinement with source video, port 9127)
# Stable Audio (6.4 GB peak) runs alone.
# The text models fill the card and spill into RAM: run them alone. So does Wan.
# Qwen-Image and YuE2 also take the whole card: run them alone.
#
# The studio sorts the servers' tasks into sections by what they produce
# (images, 3D, sound, text, video) and lets you pick the model inside a
# section (docs/adr/0004-sections-and-deletion.md). `title` is optional: by
# default the model's own name. Keep ids stable: jobs refer to them.
# No timeout_s for slow models: a studio timeout would only abandon a
# generation the server keeps running.

