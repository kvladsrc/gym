# Studio configuration: copy to ~/.config/assets-studio/studio.toml, or pass
# `--config PATH` to `just studio`.
#
# Optional settings, with their defaults:
#   data_dir = "~/.local/share/assets-studio"  # library database and files
#   max_import_bytes = 209715200               # the largest upload or URL import
#   poll_interval_s = 2.0                      # pause between checks of a server
#
# Each [[servers]] entry is one model server:
#   id         Jobs refer to it: keep it when the model behind it changes.
#   url        Where the server listens; each recipe's comment in
#              model_servers/justfile gives its default port.
#   title      Optional: shown in the UI instead of the model's own name.
#   timeout_s  Optional: seconds to wait for one generation. Leave it out for
#              slow models: a studio timeout abandons a generation that the
#              server keeps running.
#
# `just launcher` starts these servers by their ids when their jobs are ready,
# one model at a time; its RECIPES table in launcher/launcher.py names the
# recipe of each id, and a server it does not know is yours to start.
#
# Set up a server once before its first job: `cd model_servers && just setup
# <directory>`, the server's directory there (`llm` for gemma and qwen, `kimodo`
# for both Kimodo servers); its README covers weights and tokens. A server that
# is not set up simply never comes up; its jobs wait. The studio sorts every
# server's tasks into sections by what they produce (images, 3D, animation,
# sound, text, video); within a section, models keep the order given here.

